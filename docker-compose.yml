services:
  mysql:
    image: mysql:8.0
    container_name: his_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: his_db
      MYSQL_USER: his_user
      MYSQL_PASSWORD: his_password
    ports:
      - "3306:3306"
    volumes:
      - ./docker-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql